name: cloudescape-recon

on:
  push:
    branches: [ corgi ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS creds via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1

      - name: Who am I
        run: aws sts get-caller-identity

      - name: List all buckets
        run: aws s3api list-buckets

      - name: List Lambda functions
        run: aws lambda list-functions

      - name: Describe each Lambda in detail
        run: |
          for fn in $(aws lambda list-functions --query 'Functions[].FunctionName' --output text); do
            echo "=== $fn ==="
            aws lambda get-function --function-name "$fn"
            aws lambda get-function-url-config --function-name "$fn" || true
            aws lambda get-policy --function-name "$fn" || true
          done

      - name: Describe EC2 / networking
        run: |
          aws ec2 describe-instances
          aws ec2 describe-vpcs
          aws ec2 describe-subnets

      - name: CloudFront
        run: |
          aws cloudfront list-distributions

      - name: Download actual deployed Lambda source
        run: |
          URL=$(aws lambda get-function --function-name nslookupv2 --query 'Code.Location' --output text)
          curl -s -o /tmp/nslookupv2.zip "$URL"
          mkdir -p /tmp/nslookupv2_src
          unzip -o /tmp/nslookupv2.zip -d /tmp/nslookupv2_src
          echo "=== files ==="
          find /tmp/nslookupv2_src -type f
          echo "=== lambda_function.py contents ==="
          cat /tmp/nslookupv2_src/lambda_function.py


      - name: Diagnose Lambda VPC egress
        run: |
          echo "=== Route table for lambda subnet ==="
          aws ec2 describe-route-tables --filters Name=association.subnet-id,Values=subnet-0d86c3129f4405706
          echo "=== Route tables (all, in lambda_vpc) ==="
          aws ec2 describe-route-tables --filters Name=vpc-id,Values=vpc-09328d3fa21dce320
          echo "=== Security group sg-0de9d1a2c42a08a3e ==="
          aws ec2 describe-security-groups --group-ids sg-0de9d1a2c42a08a3e
          echo "=== VPC endpoints in lambda_vpc ==="
          aws ec2 describe-vpc-endpoints --filters Name=vpc-id,Values=vpc-09328d3fa21dce320
          echo "=== NAT gateways in lambda_vpc ==="
          aws ec2 describe-nat-gateways --filter Name=vpc-id,Values=vpc-09328d3fa21dce320
          
      - name: Bucket policies
        run: |
          for b in $(aws s3api list-buckets --query 'Buckets[].Name' --output text); do
            echo "=== $b ==="
            aws s3api get-bucket-policy --bucket "$b" || true
            aws s3api get-bucket-policy-status --bucket "$b" || true
          done
